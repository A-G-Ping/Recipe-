<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Recipe Cookbook — Exhaustive Family Edition</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for Editorial Cookbook Elegance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['\"Playfair Display\"', 'Georgia', 'serif'],
            display: ['\"Cinzel\"', 'serif'],
            sans: ['\"Plus Jakarta Sans\"', 'system-ui', 'sans-serif'],
          },
          colors: {
            parchment: {
              50: '#FDFBF7',
              100: '#F9F5EC',
              200: '#F2EBDC',
              300: '#E7DCBE',
              400: '#D7C49C',
              800: '#4A3B2C',
              900: '#2A1F17',
            },
            terracotta: {
              50: '#FDF5F2',
              100: '#FBE8E1',
              500: '#C85A32',
              600: '#B04B26',
              700: '#8E381A',
            },
            sage: {
              50: '#F4F7F4',
              100: '#E5EDE5',
              600: '#4E6B56',
              700: '#3D5443',
            },
            amberwood: {
              500: '#9E6D38',
              700: '#68451D',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom styling for editorial recipe texture */
    .recipe-paper {
      background-color: #fdfbf7;
      background-image: radial-gradient(#e5ded3 0.75px, transparent 0.75px);
      background-size: 16px 16px;
    }
    
    .paper-edge-shadow {
      box-shadow: 0 10px 30px -5px rgba(60, 42, 28, 0.08), 0 4px 12px -2px rgba(60, 42, 28, 0.04);
    }
    
    .checked-ingredient {
      text-decoration: line-through;
      color: #9ca3af;
      transition: all 0.2s ease;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F9F5EC;
    }
    ::-webkit-scrollbar-thumb {
      background: #D7C49C;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #B04B26;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #printable-recipe-modal, #printable-recipe-modal * {
        visibility: visible;
      }
      #printable-recipe-modal {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body class="bg-parchment-50 text-parchment-900 font-sans antialiased">

</html>
